<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolitaireDeck</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f1a; color: #e8e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
    .logo { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #9ca3af; font-size: 1.1rem; margin-bottom: 40px; text-align: center; }
    .links { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    a { color: #a78bfa; text-decoration: none; padding: 10px 24px; border: 1px solid #a78bfa44; border-radius: 8px; transition: all 0.2s; font-size: 0.95rem; }
    a:hover { background: #a78bfa22; border-color: #a78bfa; }
    .contact { margin-top: 48px; color: #6b7280; font-size: 0.9rem; }
    .contact a { border: none; padding: 0; color: #60a5fa; }
  </style>
</head>
<body>
  <div class="logo">🃏</div>
  <h1>SolitaireDeck</h1>
  <p>Classic Solitaire card game for mobile</p>
  <div class="links">
    <a href="/privacy.html">Privacy Policy</a>
    <a href="/terms.html">Terms of Use</a>
  </div>
  <div class="contact">
    Support: <a href="mailto:support@SolitaireDeck.com">support@SolitaireDeck.com</a>
  </div>
</body>
</html>
