<html lang="en">

  <title>SolitaireDeck – Classic Card Game</title>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {

      background: #050e08;
      color: #e8f0ec;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stars {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, #061a0e 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, #041208 0%, transparent 60%),
        radial-gradient(ellipse at 60% 80%, #071a10 0%, transparent 50%),
        #050e08;
      z-index: 0;
    }

    .cards-bg {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      opacity: 0;
      animation: floatCard linear infinite;
    }
