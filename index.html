<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolitaireDeck – Classic Card Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a14;
      color: #e8e8f0;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Фон со звёздами ── */
    .stars {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, #1a0a3a 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, #0a1a3a 0%, transparent 60%),
        radial-gradient(ellipse at 60% 80%, #1a0a2a 0%, transparent 50%),
        #0a0a14;
      z-index: 0;
    }

    /* ── Летящие карты ── */
    .cards-bg {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .card {
      position: absolute;
      width: 52px;
      height: 74px;
      border-radius: 8px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      opacity: 0;
      animation: floatCard linear infinite;
    }

    .card::before {
      content: attr(data-suit);
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }
    .card::after {
      content: attr(data-val);
      position: absolute;
      bottom: 4px;
      right: 6px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      transform: rotate(180deg);
    }

    .card.red { color: #e03040; }
    .card.black { color: #1a1a2e; }

    @keyframes floatCard {
      0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0; }
      5%   { opacity: 0.7; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
    }

    /* ── Основной контент ── */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .icon-wrap {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      background: linear-gradient(135deg, #6d28d9, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      margin-bottom: 28px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.1),
        0 20px 60px rgba(109,40,217,0.5),
        0 0 80px rgba(59,130,246,0.3);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 20px 60px rgba(109,40,217,0.5), 0 0 80px rgba(59,130,246,0.3); }
      50%       { box-shadow: 0 0 0 1px rgba(255,255,255,0.15), 0 20px 80px rgba(109,40,217,0.7), 0 0 120px rgba(59,130,246,0.5); }
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #c4b5fd 0%, #93c5fd 50%, #c4b5fd 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes shimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .tagline {
      color: #9ca3af;
      font-size: 1.1rem;
      margin-bottom: 44px;
      letter-spacing: 0.3px;
    }

    .badges {
      display: flex;
      gap: 12px;
      margin-bottom: 44px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .badge {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.82rem;
      color: #d1d5db;
    }

    .links {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 48px;
    }

    .btn {
      color: #e8e8f0;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s;
      border: 1px solid rgba(167,139,250,0.3);
      background: rgba(167,139,250,0.08);
      backdrop-filter: blur(8px);
    }

    .btn:hover {
      background: rgba(167,139,250,0.2);
      border-color: rgba(167,139,250,0.6);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(167,139,250,0.2);
    }

    .divider {
      width: 60px;
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin-bottom: 24px;
    }

    .contact {
      color: #6b7280;
      font-size: 0.88rem;
    }

    .contact a {
      color: #93c5fd;
      text-decoration: none;
    }
    .contact a:hover { text-decoration: underline; }

    /* ── Suits decoration ── */
    .suits {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 10;
      opacity: 0.15;
      font-size: 28px;
    }
  </style>
</head>
<body>

<div class="stars"></div>

<!-- Анимированные карты -->
<div class="cards-bg" id="cardsBg"></div>

<div class="content">
  <div class="icon-wrap">🃏</div>

  <h1>SolitaireDeck</h1>
  <p class="tagline">Classic Solitaire card game for mobile</p>

  <div class="badges">
    <span class="badge">♠ Klondike</span>
    <span class="badge">♥ Free to Play</span>
    <span class="badge">♦ Offline Mode</span>
    <span class="badge">♣ Android</span>
  </div>

  <div class="links">
    <a class="btn" href="/privacy.html">Privacy Policy</a>
    <a class="btn" href="/terms.html">Terms of Use</a>
  </div>

  <div class="divider"></div>
  <div class="contact">
    Support: <a href="mailto:support@SolitaireDeck.com">support@SolitaireDeck.com</a>
  </div>
</div>

<div class="suits">♠ ♥ ♦ ♣</div>

<script>
  const CARDS = [
    { val: 'A',  suit: '♠', cls: 'black' },
    { val: 'K',  suit: '♥', cls: 'red'   },
    { val: 'Q',  suit: '♦', cls: 'red'   },
    { val: 'J',  suit: '♣', cls: 'black' },
    { val: '10', suit: '♠', cls: 'black' },
    { val: '9',  suit: '♥', cls: 'red'   },
    { val: '8',  suit: '♦', cls: 'red'   },
    { val: '7',  suit: '♣', cls: 'black' },
    { val: 'A',  suit: '♥', cls: 'red'   },
    { val: 'K',  suit: '♠', cls: 'black' },
    { val: 'Q',  suit: '♣', cls: 'black' },
    { val: 'J',  suit: '♦', cls: 'red'   },
  ];

  const bg = document.getElementById('cardsBg');

  CARDS.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'card ' + c.cls;
    el.textContent = c.suit;
    el.setAttribute('data-suit', c.val);
    el.setAttribute('data-val', c.val);

    const left     = 5 + Math.random() * 90;
    const duration = 12 + Math.random() * 16;
    const delay    = -(Math.random() * duration);
    const rotate   = -30 + Math.random() * 60;

    el.style.cssText = `
      left: ${left}%;
      animation-duration: ${duration}s;
      animation-delay: ${delay}s;
      --rotate: ${rotate}deg;
    `;
    bg.appendChild(el);
  });
</script>

</body>
</html>
