<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolitaireDeck – Classic Card Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at 50% 0%, #1d4f2f 0%, #0f2d1a 42%, #091d11 100%);
      color: #e8f5ec;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cards-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .fc {
      position: absolute;
      top: -90px;
      width: 52px;
      height: 74px;
      border-radius: 7px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      opacity: 0;
      animation: fall linear infinite;
    }

    .fc .tl {
      position: absolute;
      top: 4px;
      left: 5px;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.2;
      text-align: left;
    }

    .fc .br {
      position: absolute;
      bottom: 4px;
      right: 5px;
      font-size: 10px;
      font-weight: 800;
      transform: rotate(180deg);
    }

    .fc.red { color: #cc2233; }
    .fc.black { color: #1a1a2e; }

    @keyframes fall {
      0% { transform: translateY(0) rotate(var(--r)); opacity: 0; }
      6% { opacity: 0.75; }
      92% { opacity: 0.5; }
      100% { transform: translateY(110vh) rotate(calc(var(--r) + var(--spin))); opacity: 0; }
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-cards {
      position: relative;
      width: 150px;
      height: 122px;
      margin-bottom: 28px;
      filter: drop-shadow(0 18px 40px rgba(0,0,0,0.35));
    }

    .hero-card {
      position: absolute;
      width: 84px;
      height: 112px;
      border-radius: 12px;
      background: #fff;
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.08),
        0 10px 28px rgba(0,0,0,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-card .corner {
      position: absolute;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.05;
      text-align: center;
    }

    .hero-card .corner.tl {
      top: 7px;
      left: 8px;
    }

    .hero-card .corner.br {
      right: 8px;
      bottom: 7px;
      transform: rotate(180deg);
    }

    .hero-card .center {
      font-size: 44px;
      line-height: 1;
    }

    .hero-card.spade {
      left: 4px;
      top: 10px;
      z-index: 2;
      color: #111;
      transform: rotate(-8deg);
    }

    .hero-card.heart {
      right: 4px;
      top: 0;
      z-index: 1;
      color: #d0202a;
      transform: rotate(8deg);
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: -1px;
      color: #e8f5ec;
      margin-bottom: 6px;
    }

    .sub {
      font-size: 1rem;
      color: #9ed3ae;
      margin-bottom: 38px;
    }

    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 34px;
    }

    .btn {
      text-decoration: none;
      color: #e8f5ec;
      padding: 11px 26px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 500;
      border: 1px solid rgba(46,204,113,0.32);
      background: rgba(46,204,113,0.09);
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }

    .btn:hover {
      border-color: rgba(46,204,113,0.75);
      background: rgba(46,204,113,0.16);
      transform: translateY(-1px);
    }

    .store-btns {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 44px;
    }

    .store-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #e8f5ec;
      padding: 11px 22px;
      border-radius: 12px;
      border: 1px solid rgba(46,204,113,0.25);
      background: rgba(9,29,17,0.72);
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.2s;
      backdrop-filter: blur(8px);
    }

    .store-btn:hover {
      border-color: rgba(46,204,113,0.65);
      background: rgba(46,204,113,0.1);
      transform: translateY(-1px);
    }

    .store-btn .ico {
      font-size: 20px;
    }

    .store-btn small {
      display: block;
      font-size: 0.7rem;
      color: #9ed3ae;
      line-height: 1.1;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: rgba(46,204,113,0.25);
      margin-bottom: 20px;
    }

    .contact {
      font-size: 0.88rem;
      color: #70a47f;
    }

    .contact a {
      color: #2ecc71;
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    .suits {
      position: fixed;
      bottom: 20px;
      font-size: 22px;
      opacity: 0.12;
      letter-spacing: 16px;
      z-index: 1;
      color: #9ed3ae;
    }

    @media (max-width: 520px) {
      body {
        justify-content: flex-start;
        padding-top: 48px;
        overflow-y: auto;
      }

      .content {
        padding: 28px 18px;
      }

      .links,
      .store-btns {
        flex-direction: column;
        width: 100%;
        max-width: 280px;
      }

      .btn,
      .store-btn {
        justify-content: center;
      }

      .suits {
        display: none;
      }
    }
  </style>
</head>
<body>

<div class="cards-bg" id="bg"></div>

<div class="content">
  <div class="hero-cards">
    <div class="hero-card spade">
      <span class="corner tl">A<br>♠</span>
      <span class="center">♠</span>
      <span class="corner br">A<br>♠</span>
    </div>
    <div class="hero-card heart">
      <span class="corner tl">K<br>♥</span>
      <span class="center">♥</span>
      <span class="corner br">K<br>♥</span>
    </div>
  </div>

  <h1>SolitaireDeck</h1>
  <p class="sub">Classic Solitaire Games for Mobile</p>

  <div class="links">
    <a class="btn" href="/privacy.html">Privacy Policy</a>
    <a class="btn" href="/terms.html">Terms of Use</a>
  </div>

  <div class="store-btns">
    <a class="store-btn" href="#">
      <span class="ico">🍎</span>
      <span><small>Download on the</small>App Store</span>
    </a>
    <a class="store-btn" href="#">
      <span class="ico">▶</span>
      <span><small>Get it on</small>Google Play</span>
    </a>
  </div>

  <div class="divider"></div>
  <div class="contact">
    Support: <a href="mailto:support@SolitaireDeck.com">support@SolitaireDeck.com</a>
  </div>
</div>

<div class="suits">♠ ♥ ♦ ♣</div>

<script>
  var CARDS = [
    {v:'A',s:'♠',c:'black'}, {v:'K',s:'♥',c:'red'},
    {v:'Q',s:'♦',c:'red'},  {v:'J',s:'♣',c:'black'},
    {v:'10',s:'♠',c:'black'}, {v:'9',s:'♥',c:'red'},
    {v:'8',s:'♦',c:'red'},  {v:'7',s:'♣',c:'black'},
    {v:'A',s:'♥',c:'red'},  {v:'K',s:'♠',c:'black'},
    {v:'Q',s:'♣',c:'black'}, {v:'J',s:'♦',c:'red'},
    {v:'6',s:'♠',c:'black'}, {v:'5',s:'♥',c:'red'}
  ];

  var bg = document.getElementById('bg');

  for (var i = 0; i < CARDS.length; i++) {
    var c = CARDS[i];
    var el = document.createElement('div');
    el.className = 'fc ' + c.c;
    el.innerHTML =
      '<span class="tl">' + c.v + '<br>' + c.s + '</span>' +
      c.s +
      '<span class="br">' + c.v + '<br>' + c.s + '</span>';

    var left = 3 + Math.random() * 93;
    var dur = 10 + Math.random() * 14;
    var del = -(Math.random() * dur);
    var rot = -25 + Math.random() * 50;
    var spin = (Math.random() > 0.5 ? 1 : -1) * (20 + Math.random() * 40);

    el.style.left = left + '%';
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = del + 's';
    el.style.setProperty('--r', rot + 'deg');
    el.style.setProperty('--spin', spin + 'deg');

    bg.appendChild(el);
  }
</script>

</body>
</html>
